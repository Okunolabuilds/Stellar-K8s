{{- if and .Values.secrets.create (not .Values.secrets.useExternalSecrets) }}
{{- /*
  Issue #1554: The standard secret key for the Stellar Core seed is
  `STELLAR_CORE_SEED`. The legacy `SEED` key is still accepted for
  backwards compatibility, but the operator will log a deprecation
  warning when only the legacy key is present. Prefer
  `STELLAR_CORE_SEED` in all new deployments and migrate existing
  secrets with `scripts/migrate-seed-key.sh`.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stellar-operator.fullname" . }}-secrets
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.items }}
data:
  {{- range $name, $config := .Values.secrets.items }}
  {{- /* Default to the standardized STELLAR_CORE_SEED key when a key is not explicitly set. */}}
  {{ default "STELLAR_CORE_SEED" $config.key }}: {{ $config.value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}