# Sample StellarNode validator demonstrating dry-run reconciliation verification
# and seed rotation observability configuration.
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: sample-dryrun-validator
  namespace: default
spec:
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  storage:
    storageClass: standard
    size: 50Gi
    retentionPolicy: Retain
  validatorConfig:
    seedSecretRef: validator-seed
    enableHistoryArchive: false
