{{- if and (eq .Values.nodeType "Validator") .Values.seedSecret.enabled }}
{{- /*
  Issue #1554: The seed secret key is standardized on STELLAR_CORE_SEED.
  The legacy "SEED" key is deprecated; operators should migrate existing
  secrets using scripts/migrate-seed-key.sh. An explicit .Values.seedSecret.key
  is still honored for backwards compatibility during the transition.
*/}}
{{- $seedKey := .Values.seedSecret.key | default "STELLAR_CORE_SEED" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.seedSecret.name | quote }}
  labels:
    app.kubernetes.io/name: stellar-node-gitops
    app.kubernetes.io/part-of: stellar-k8s
    stellar.org/gitops-version: v1
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  {{ $seedKey }}: {{ .Values.seedSecret.value | quote }}
{{- end }}